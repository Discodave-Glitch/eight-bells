name: Build desktop apps

# Push a tag such as v2.0.0 and this builds the Windows and Mac apps, then attaches them to the
# release for that tag (creating the release if you have not already). If the Mac builder is unavailable you still get Windows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/Eight-Bells-*.exe
            dist/Eight-Bells-*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" files/* --repo "${{ github.repository }}" --title "Eight Bells ${{ github.ref_name }}" --generate-notes \
            || gh release upload "${{ github.ref_name }}" files/* --repo "${{ github.repository }}" --clobber
